      <rect width="80" height="80" fill="#fff"/>
      <circle cx="40" cy="40" r="20.8" fill="#000"/>
    </mask>
  </defs>
  <circle cx="40" cy="40" r="38.709677" fill="#ffd502"/>
  <g fill="#000" transform="translate(40 40) scale(0.9) translate(-40 -40)">
    <g mask="url(#hole)">
      <circle cx="40" cy="40" r="28.5"/>
      <rect x="23.35" y="7.5" width="33.3" height="20"/>
      <rect x="23.35" y="52.5" width="33.3" height="20.02"/>
    </g>
    <g transform="matrix(1.11,0,0,1.11,-4.4,-4.4319318)">
      <rect x="30.879238" y="36.464836" width="18.241524" height="14.829749"/>
      <path d="m 32.813969,36.550846 c -0.0035,-10.424487 14.292414,-10.322032 14.372063,-0.06356 l -2.902092,-0.02074 c -0.03143,-6.537845 -8.535436,-6.409275 -8.568112,0.127116 z"/>
    </g>
  </g>
</svg>
