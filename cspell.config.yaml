  - fips
  - fitbit
  - gadgetbridge
  - galulex
  - gettext
  - getUserMedia
  - gitea
  - hmac
  - ihdr
  - inspectable
  - janky
  - jsQR
  - kiezelpay
  - leen
  - lisoveliy
