version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # packages that must move in lockstep, or npm ci fails on peer ranges
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      commitlint:
        patterns: ["@commitlint/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
