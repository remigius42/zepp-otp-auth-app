name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint and gitleaks check the whole history, and the docs'
          # "last updated" dates need real commit dates
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check for Git conflict markers and whitespace errors
        run: git diff --check
      - name: Scan for secrets (gitleaks)
        # third-party action pinned to a commit SHA (immutable, unlike tags)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install npm packages
        run: npm ci
      - name: Audit npm package signatures # guards against a tampered registry mirror or proxy
        run: npm audit signatures
      - name: Check commit messages
        run: npx commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD
      - name: Check licenses of the production dependencies
        run: npm run check-licenses
      # The engine check in `lint` bundles the Settings App, which imports
      # this generated, gitignored file.
      - name: Generate licenses data
        run: npm run generate-licenses-data
      - name: Lint (Prettier, cspell, markdownlint, oxlint, tsc, engine check)
        run: npm run lint
      - name: Test
        run: npx vitest run --coverage --reporter default --reporter junit --outputFile.junit=reports/junit.xml
      - name: Build the watch app
        run: npm run build
      - name: Build the docs site # fails on dead links
        run: npm run docs:build
      - name: Upload the .zab
        uses: actions/upload-artifact@v7
        with:
          name: OTP Auth Zepp app
          path: build/zeus/dist/*.zab
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
      - name: Test summary
        if: always()
        # third-party action pinned to a commit SHA (immutable, unlike tags)
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: reports/junit.xml
  security_scan:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install production dependencies
        # `--ignore-scripts` because `scripts.prepare` runs husky, a dev
        # dependency omitted here
        run: npm install --omit=dev --ignore-scripts
      - name: Run security scan with Trivy
        # third-party action pinned to a commit SHA (immutable, unlike tags)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: 1
  deploy_pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, security_scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
